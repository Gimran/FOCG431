; https://docs.platformio.org/page/projectconf.html
	; -D CAN_DEBUG
	; -D CAN_RX=PA11
	; -D CAN_TX=PA12
	; -D HAL_CAN_MODULE_ENABLED
	;-D HAL_FDCAN_MODULE_ENABLED
		; -D HSE_VALUE=16000000U

[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
debug_tool = stlink
upload_protocol = stlink
lib_deps = 
	askuric/Simple FOC@^2.4.0
	; https://github.com/simplefoc/Arduino-FOC.git#fix_lowside_sync_lost
	;// warning error https://community.simplefoc.com/t/stm32h750-low-side-current-measurement/7342/2
	; simplefoc/SimpleFOCDrivers@^1.0.9
	https://github.com/simplefoc/Arduino-FOC-drivers.git#feat_can_commander
	embeddedartistry/LibPrintf@^1.2.13
	https://github.com/simplefoc/SimpleCANio.git
	;//https://github.com/simplefoc/Arduino-FOC-drivers/blob/feat_can_commander/examples/comms/can/can_example/can_example.ino
lib_archive = false
; lib_ldf_mode = chain+
build_flags =
	-D HAL_CORDIC_MODULE_ENABLED
	-D HAL_FDCAN_MODULE_ENABLED
	-D HSE_VALUE=16000000U

; Сборка под бутлоадер Katapult (https://github.com/Arksine/katapult):
; приложение со смещением 8 КиБ (0x08002000), Katapult занимает 0x08000000..0x08002000.
; board_build.flash_offset задаёт VECT_TAB_OFFSET и LD_FLASH_OFFSET (линкер),
; board_upload.offset_address - адрес прошивки для stlink.
; Прошивка по CAN: python3 flashtool.py -i can0 -u <uuid> -f .pio/build/genericSTM32G431CB_katapult/firmware.bin
[env:genericSTM32G431CB_katapult]
extends = env:genericSTM32G431CB
board_build.flash_offset = 0x2000
board_upload.offset_address = 0x08002000
